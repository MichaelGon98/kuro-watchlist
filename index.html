<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuro Watchlist</title>
<meta name="theme-color" content="#0b0b12">
<script>/* apply the active profile's theme before first paint (see applyPrefs) */try{const a=JSON.parse(localStorage.getItem('kuro.active')),t=(JSON.parse(localStorage.getItem('kuro.prefs'))||{})[a==null?'guest':String(a)]?.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0b0b12;--bg2:#12121c;--card:#171724;--card2:#1e1e2e;--line:#2a2a3d;
  --text:#ecebf5;--muted:#9a99b3;--accent:#8b7bff;--accent2:#ff6bd6;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --r:16px;--nav-h:64px;
  --glass:rgba(11,11,18,.72);--glass2:rgba(11,11,18,.88);--glow1:#2b2160;--glow2:#4a1f55;--thumb:#3a3a55;--hover:#4a4a6e;--desc:#cfcee2;--on-accent:#fff;
}
/* ---------- themes (picked per profile in Edit profile; [data-theme] set on <html>) ---------- */
[data-theme=sakura]{--on-accent:#2a0818;--bg:#140b11;--bg2:#1c1018;--card:#24141f;--card2:#2e1a28;--line:#3f2537;--text:#f7eaf2;--muted:#b89aab;--accent:#ff7eb6;--accent2:#ffb86b;
  --glass:rgba(20,11,17,.72);--glass2:rgba(20,11,17,.9);--glow1:#5a1f42;--glow2:#5c3418;--thumb:#5a3049;--hover:#6b3a58;--desc:#e6d0dc}
[data-theme=ocean]{--on-accent:#031522;--bg:#06111a;--bg2:#0b1824;--card:#102030;--card2:#16293b;--line:#223a50;--text:#e6f2fb;--muted:#8fa9bf;--accent:#38bdf8;--accent2:#818cf8;
  --glass:rgba(6,17,26,.72);--glass2:rgba(6,17,26,.9);--glow1:#0c3b5c;--glow2:#2a2a6b;--thumb:#2d4a63;--hover:#35597a;--desc:#cbdbe8}
[data-theme=forest]{--on-accent:#03170b;--bg:#08120d;--bg2:#0d1912;--card:#122218;--card2:#182b1f;--line:#24402e;--text:#e8f5ec;--muted:#93b09d;--accent:#4ade80;--accent2:#2dd4bf;
  --glass:rgba(8,18,13,.72);--glass2:rgba(8,18,13,.9);--glow1:#14462a;--glow2:#0f3f3c;--thumb:#2f5039;--hover:#3a6347;--desc:#cfe3d5}
[data-theme=sunset]{--on-accent:#240a02;--bg:#140c08;--bg2:#1c120c;--card:#251811;--card2:#2f1f16;--line:#45301f;--text:#fbefe6;--muted:#c0a08a;--accent:#fb923c;--accent2:#f43f5e;
  --glass:rgba(20,12,8,.72);--glass2:rgba(20,12,8,.9);--glow1:#5c2a10;--glow2:#5a1428;--thumb:#5a3a24;--hover:#6e4730;--desc:#ead6c8}
[data-theme=amoled]{--on-accent:#14082e;--bg:#000;--bg2:#000;--card:#0c0c0f;--card2:#141418;--line:#232329;--text:#f2f2f5;--muted:#9a9aa6;--accent:#a78bfa;--accent2:#f472b6;
  --glass:rgba(0,0,0,.8);--glass2:rgba(0,0,0,.92);--glow1:transparent;--glow2:transparent;--thumb:#2c2c33;--hover:#3a3a44;--desc:#d4d4dc}
[data-theme=light]{--bg:#f4f4f9;--bg2:#fff;--card:#fff;--card2:#ececf4;--line:#dcdce8;--text:#17171f;--muted:#5f5f75;--accent:#6d5dfc;--accent2:#e0479e;
  --good:#16a34a;--warn:#b45309;--bad:#dc2626;--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.92);--glow1:#ddd6ff;--glow2:#ffd6ee;--thumb:#c4c4d4;--hover:#b8b8cc;--desc:#33334a}
html[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-button,::-webkit-scrollbar-corner{display:none;background:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 10% -10%,var(--glow1) 0,transparent 60%),
  radial-gradient(700px 400px at 100% 0,var(--glow2) 0,transparent 55%),var(--bg);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}

/* header */
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);background:var(--glass);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1280px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo img{width:32px;height:32px;border-radius:50%;display:block}
.search{flex:1;position:relative;max-width:560px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 40px;outline:0}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.6}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--card2);color:var(--text)}
.tab b{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;padding:1px 7px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}

main{max-width:1280px;margin:auto;padding:16px 16px calc(var(--nav-h) + 40px)}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}

/* filters */
.filters{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
select,.field input[type=number]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:0}
select option{background:var(--card)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
.ftoggle{display:none}
.fbottom{display:flex;gap:8px;margin-top:12px;align-items:center;justify-content:space-between}
.link{color:var(--accent);font-weight:600;font-size:13px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--line);transition:transform .18s,border-color .18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--hover)}
.cover{aspect-ratio:2/3;background:var(--card2) center/cover;position:relative;cursor:pointer}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(11,11,18,.92))}
.badge{position:absolute;z-index:2;top:8px;left:8px;background:rgba(11,11,18,.75);color:#fff;backdrop-filter:blur(6px);padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.badge.s{color:#4ade80}.badge.m{color:#fbbf24}.badge.l{color:#f87171} /* on a dark chip in every theme */
.add{position:absolute;z-index:3;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(11,11,18,.75);color:#fff;backdrop-filter:blur(6px);display:grid;place-items:center;font-size:20px;line-height:1;transition:.15s}
.add:hover{background:var(--accent)}
.add.in{background:var(--accent);color:var(--on-accent)}
.cover .ctitle{color:#fff}.cover .cmeta{color:#d4d3e2}
.cinfo{position:absolute;z-index:2;left:10px;right:10px;bottom:9px}
.ctitle{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{color:var(--muted);font-size:12px;margin-top:3px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.more{display:block;margin:24px auto;padding:11px 26px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.skel{aspect-ratio:2/3;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* list subtabs */
.sub{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.lbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lbar input,.lbar select{width:auto;flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:22px;width:100%;max-width:780px;max-height:90vh;overflow:auto;position:relative;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(24px)}}
.banner{height:170px;background:var(--card2) center/cover;position:relative}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,var(--bg2))}
.close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
.mbody{padding:0 22px 24px;margin-top:-70px;position:relative;z-index:2}
.mtop{display:flex;gap:18px}
.mcover{width:130px;aspect-ratio:2/3;border-radius:12px;background:var(--card2) center/cover;flex:none;box-shadow:0 10px 30px #000a}
.mtitle{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:78px 0 4px}
.msub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.stat b{font-size:15px}
.desc{color:var(--desc);max-height:150px;overflow:auto;margin:10px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.seg button{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{padding:11px 18px;border-radius:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:18px}

/* episodes, where to watch, trailer, next up */
.sh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
#trailer iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:10px 0}
.ep{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.ep.done{opacity:.55}
.epth{width:84px;aspect-ratio:16/9;border-radius:8px;background:var(--card2) center/cover;flex:none}
.epm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epw{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:12px;color:var(--on-accent);flex:none}
.tick{width:22px;color:var(--good);font-weight:800;text-align:center}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.epc{padding:8px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600}
.epc.done{background:var(--accent);color:var(--on-accent);border-color:transparent}
.nu{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.nu::-webkit-scrollbar{display:none}
.nuc{flex:none;width:260px;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.nuimg{width:48px;aspect-ratio:2/3;border-radius:8px;background:var(--card2) center/cover;flex:none}
.nuc .ctitle{font-size:13px}
.nuc .new{color:var(--accent);font-weight:700}
.nuc.soon{opacity:.7}
.nuc .grow,.wkrow .grow{flex:1;min-width:0}
.plus{flex:none;align-self:center;padding:7px 11px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-weight:800;font-size:13px}
.add.plus{width:auto;padding:0 11px;font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
#toast{max-width:min(92vw,520px);width:max-content;display:flex;align-items:center;gap:12px;border-radius:16px}
#toast .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#toast.act{pointer-events:auto}
/* profile look */
.iconbtn.me{border:2px solid var(--me,var(--accent))}
.iconbtn .av{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.prof .av{color:#fff}
.pcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 35%,var(--card)),var(--card)) center/cover;margin-bottom:6px}
.pcard .grow{flex:1;min-width:0}
.pav{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--pc);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800}
.pav.big{width:96px;height:96px;font-size:38px;margin:auto}
.pname{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{border-color:var(--text)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.themes button{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:12.5px;font-weight:600}
.themes button.on{border-color:var(--accent)}
.themes i{width:100%;height:38px;border-radius:8px;display:flex;align-items:flex-end;padding:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.themes b{width:55%;height:8px;border-radius:99px}
/* rating & notes */
.rate{display:flex;gap:4px}
.rate button{flex:1;min-width:0;max-width:42px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px}
.rate button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
.notes{width:100%;min-height:70px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;outline:0;resize:vertical;font:inherit;color:inherit}
.notes:focus{border-color:var(--accent)}
.badge.mine{color:var(--accent2)}
.set label.check{display:flex;gap:8px;align-items:center;font-weight:500;margin:6px 0 0}
.set label.check input{accent-color:var(--accent);width:17px;height:17px}
#toast .link{flex:none}
/* this week */
.wkday{margin:18px 0 8px;font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.wkday.today{color:var(--accent)}
.wkrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.wkrow .t{width:48px;font-weight:700;font-size:13px;flex:none;text-align:center}
.wkrow .nuimg{width:40px}
.wkrow.past .t{color:var(--muted)}
.wkrow .ok{color:var(--good);font-weight:700}
.wkrow .new{color:var(--accent);font-weight:700}
#v-week{max-width:760px;margin:auto}
#nextup{margin-bottom:16px}

/* settings */
.set label{display:block;font-weight:600;margin:14px 0 4px}
.set input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.prof{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prof img,.prof .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--card2);font-weight:700}
.prof .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.prof .tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent);vertical-align:1px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.iconbtn.me{overflow:hidden;padding:0;font-weight:700}
.iconbtn.me img{width:100%;height:100%;object-fit:cover}
.iconbtn.expired{opacity:.55;border-color:var(--bad)}
details.hint summary{cursor:pointer}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--line);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:80;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tile b{display:block;font-size:26px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12.5px}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 24px}
.spanel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px 10px}
.brow{display:grid;grid-template-columns:minmax(90px,30%) 1fr 40px;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;font-size:13.5px}
.brow[data-ls]{cursor:pointer}
.brow:hover{background:var(--card2)}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bt{height:10px;position:relative}
.bt i{position:absolute;left:0;top:0;bottom:0;min-width:2px;background:var(--accent);border-radius:0 4px 4px 0}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px;padding:20px 4px 0}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--muted);border-radius:8px}
.hist div:hover{background:var(--card2)}

.hist em{font-style:normal;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.hist em:empty{visibility:hidden}
.hist em:empty::before{content:'0'}
.hax{display:flex;gap:6px;padding:4px 4px 0;font-size:12px;color:var(--muted)}
.hax span{flex:1;text-align:center}
.toprow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px;cursor:pointer}

  .bar{flex-wrap:wrap;gap:10px}

  .tabs{display:none}
  .logo{flex:1}

  .filters{padding:10px 14px}
  nav.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass2);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
  nav.bottom button.on{color:var(--accent)}
  nav.bottom svg{width:22px;height:22px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:92vh}
  .mcover{width:100px}.mtitle{font-size:20px;margin-top:70px}
}
@media (min-width:761px){.ftoggle{display:none}}

<body>
<header><div class="bar">
  <div class="logo"><img src="icon-192.png" alt="">Kuro</div>
  <div class="search" id="searchWrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search anime…" autocomplete="off">
  </div>
  <div class="tabs">
    <button class="tab" data-view="discover">Discover</button>
    <button class="tab" data-view="week">This week</button>
    <button class="tab" data-view="list">My List <b id="cnt1">0</b></button>
    <button class="tab" data-view="stats">Stats</button>
  </div>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main>
  <!-- DISCOVER -->
  <section id="v-discover">
    <div id="nextup" style="display:none"><h2 class="sec">Next up</h2><div class="nu" id="nuRow"></div></div>
    <div class="filters" id="filters">
      <button class="btn ftoggle" id="ftoggle">⚙ Filters <span id="fcount"></span></button>
      <div class="fbody">
        <div class="frow">
          <div class="field"><label>Sort</label><select id="f-sort">
            <option value="TRENDING_DESC">Trending</option><option value="POPULARITY_DESC">Most popular</option>
            <option value="SCORE_DESC">Top rated</option><option value="START_DATE_DESC">Newest</option>
            <option value="FAVOURITES_DESC">Most favourited</option></select></div>
          <div class="field"><label>Format</label><select id="f-format"><option value="">Any</option><option>TV</option><option>TV_SHORT</option><option>MOVIE</option><option>OVA</option><option>ONA</option><option>SPECIAL</option></select></div>
          <div class="field"><label>Status</label><select id="f-status"><option value="">Any</option><option value="RELEASING">Airing</option><option value="FINISHED">Finished</option><option value="NOT_YET_RELEASED">Upcoming</option></select></div>
          <div class="field"><label>Season</label><select id="f-season"><option value="">Any</option><option value="WINTER">Winter</option><option value="SPRING">Spring</option><option value="SUMMER">Summer</option><option value="FALL">Fall</option></select></div>
          <div class="field"><label>Year</label><select id="f-year"><option value="">Any</option></select></div>
          <div class="field"><label>Min score: <span id="scoreV">0</span></label><input type="range" id="f-score" min="0" max="90" step="5" value="0"></div>
        </div>

  </section>

  <!-- THIS WEEK -->
  <section id="v-week" style="display:none">
    <div class="sub" id="wkmode"><button class="chip on" data-wk="mine">My shows</button><button class="chip" data-wk="all">All popular</button></div>
    <div id="wk"></div>

  <!-- LIST -->

      <input id="lq" type="search" placeholder="Filter my list…">
      <select id="lgenre"><option value="">All genres</option></select>
      <select id="lsort"><option value="added">Recently added</option><option value="title">Title A–Z</option><option value="score">Score</option><option value="mine">My rating</option><option value="year">Year</option></select>

    <div class="grid" id="lgrid"></div>

  <!-- STATS -->

</main>

<nav class="bottom">
  <button data-view="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Discover</button>
  <button data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>This week</button>

  <button data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Stats</button>
  <button id="navSet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Settings</button>
</nav>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GENRES=['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mahou Shoujo','Mecha','Music','Mystery','Psychological','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Thriller'];
const STATUSES=[['planning','Plan to watch'],['watching','Watching'],['repeating','Rewatching'],['paused','Paused'],['completed','Completed'],['dropped','Dropped']];
const ACTIVE=['watching','repeating']; // statuses that show episode progress and appear in Next up
const DEFAULT_PROVIDER=''; // no default Watch link: each user may set their own in Settings (the button is hidden until then)
// Built-in AniList client (public id, implicit grant, no secret). Its Redirect URL is the hosted address,
// so it is only used there; other addresses (localhost, LAN) need their own client in Settings.
const HOSTED_URL='https://michaelgon98.github.io/kuro-watchlist/',BUILTIN_CLIENT_ID='58014';
const APP_URL=location.origin+location.pathname.replace(/index\.html$/,''),IS_HOSTED=APP_URL===HOSTED_URL;
const clientId=()=>settings.clientId||(IS_HOSTED?BUILTIN_CLIENT_ID:'');

/* ---------- storage & profiles ---------- */
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem(k)}catch{}}
};
// A profile is an AniList account. Its list is cached per browser under kuro.list.<userId>
// and synced with AniList, so it follows the user to any browser they sign in on.
// kuro.list (no suffix) is the guest list for use without an account.
let settings=store.get('kuro.settings',{provider:DEFAULT_PROVIDER}); // device settings: provider, clientId
let profiles=store.get('kuro.profiles',{});  // userId -> {id,name,avatar,token,lastSync,pendingDel}
let pendingTok=null;
if(settings.token){ // one-time migration from the single-account layout
  if(settings.user){
    const u=settings.user;profiles[u.id]={id:u.id,name:u.name,token:settings.token,lastSync:settings.lastSync};
    store.set('kuro.list.'+u.id,store.get('kuro.list',{}));store.del('kuro.list');store.set('kuro.active',u.id);store.set('kuro.profiles',profiles);
  }else pendingTok=settings.token;
  delete settings.token;delete settings.user;delete settings.lastSync;store.set('kuro.settings',settings);
}
const activeId=store.get('kuro.active',null);
const me=()=>profiles[activeId]||null;
const listKey=()=>me()?'kuro.list.'+me().id:'kuro.list';
let list=store.get(listKey(),{});          // id -> item
const saveList=()=>{store.set(listKey(),list);updateCounts();scheduleSync()};
const saveSettings=()=>store.set('kuro.settings',settings);
const saveProfiles=()=>store.set('kuro.profiles',profiles);
// Per-profile look, kept in this browser only (AniList has no place to store it):
// kuro.prefs = {[userId|'guest']: {nick, pic (small JPEG data URL), picMode:'anilist'|'photo'|'initial', color, theme(reserved)}}
let prefsAll=store.get('kuro.prefs',{});
const prefKey=()=>me()?String(me().id):'guest';
const myPrefs=()=>prefsAll[prefKey()]||{};
const savePrefs=p=>{prefsAll[prefKey()]=p;store.set('kuro.prefs',prefsAll)};
const PCOLORS=['#8b7bff','#ff6bd6','#38bdf8','#4ade80','#fbbf24','#f87171','#f97316','#a3a3c2'];
// Display name and avatar for a profile (p = AniList profile or null for guest), honouring the user's customisation
function look(p,pr=prefsAll[p?String(p.id):'guest']||{}){
  const name=pr.nick||p?.name||'Guest';
  const src=pr.picMode==='photo'&&pr.pic?pr.pic:pr.picMode!=='initial'&&p?.avatar?p.avatar:'';
  const col=pr.color||PCOLORS[0];
  return{name,col,custom:!!(pr.nick||pr.picMode||pr.color),
    av:cls=>src?`<img class="${cls||''}" src="${esc(src)}" alt="">`:`<span class="av ${cls||''}" style="background:${esc(col)}">${esc([...name][0]||'?').toUpperCase()}</span>`};
}
// App themes: CSS variable sets in [data-theme=…] blocks; 'dark' (Midnight) is the :root default
const THEMES=[['dark','Midnight','#0b0b12','#8b7bff','#ff6bd6'],['sakura','Sakura','#140b11','#ff7eb6','#ffb86b'],['ocean','Ocean','#06111a','#38bdf8','#818cf8'],
  ['forest','Forest','#08120d','#4ade80','#2dd4bf'],['sunset','Sunset','#140c08','#fb923c','#f43f5e'],['amoled','AMOLED black','#000000','#a78bfa','#f472b6'],['light','Light','#f4f4f9','#6d5dfc','#e0479e']];
// Applies the active profile's look (theme, colour) to the whole page; `t` previews a theme without saving
function applyPrefs(t){
  const th=THEMES.find(x=>x[0]===(t||myPrefs().theme))||THEMES[0],h=document.documentElement;
  h.style.setProperty('--me',myPrefs().color||PCOLORS[0]);h.dataset.theme=th[0];
  document.querySelector('meta[name=theme-color]').content=th[2]; // phone status bar / installed app title bar
}
function switchProfile(id,msg){store.set('kuro.active',id);try{if(msg)sessionStorage.setItem('kuro.toast',msg)}catch{}location.replace(location.pathname+location.search)}

/* ---------- AniList ---------- */
const QUERY=`query($page:Int,$perPage:Int,$search:String,$genre_in:[String],$format:MediaFormat,$season:MediaSeason,$seasonYear:Int,$status:MediaStatus,$sort:[MediaSort],$score:Int){
Page(page:$page,perPage:$perPage){pageInfo{hasNextPage total}
media(type:ANIME,search:$search,genre_in:$genre_in,format:$format,season:$season,seasonYear:$seasonYear,status:$status,sort:$sort,averageScore_greater:$score,isAdult:false){
id idMal title{romaji english} coverImage{large color} bannerImage description(asHtml:false) genres format episodes duration status season seasonYear averageScore popularity
studios(isMain:true){nodes{name}} nextAiringEpisode{episode airingAt} trailer{id site} siteUrl}}}`;
async function anilist(vars){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:QUERY,variables:vars})});
  if(!r.ok)throw new Error(r.status===429?'Rate limited, wait a moment':'AniList error '+r.status);
  const j=await r.json(); if(j.errors)throw new Error(j.errors[0].message); return j.data.Page;
}
const titleOf=m=>m.title.english||m.title.romaji;
function slim(m){return{id:m.id,idMal:m.idMal,title:m.title,cover:m.coverImage.large,color:m.coverImage.color,banner:m.bannerImage,
  desc:m.description,genres:m.genres,format:m.format,episodes:m.episodes,duration:m.duration,status:m.status,season:m.season,year:m.seasonYear,
  score:m.averageScore,pop:m.popularity,studio:m.studios?.nodes?.[0]?.name,next:m.nextAiringEpisode,trailer:m.trailer,url:m.siteUrl,mstatus:m.status}}
// media fields safe to copy onto a list item: `status` there means the list status, so the airing status goes in `mstatus`
function freshMedia(m){const{status,...f}=slim(m);return f}

/* ---------- state ---------- */
const F={sort:'TRENDING_DESC',format:'',status:'',season:'',year:'',score:0,genres:new Set(),q:''};
let page=1,hasNext=false,loading=false,cache={},view='discover',listStatus='watching';

/* ---------- filters UI ---------- */
(function init(){
  const y=new Date().getFullYear()+1;
  for(let i=y;i>=1990;i--)$('#f-year').insertAdjacentHTML('beforeend',`<option>${i}</option>`);
  $('#genreChips').innerHTML=GENRES.map(g=>`<button class="chip" data-g="${g}">${g}</button>`).join('');
  $('#lgenre').insertAdjacentHTML('beforeend',GENRES.map(g=>`<option>${g}</option>`).join(''));
  $('#genreChips').onclick=e=>{const g=e.target.dataset.g;if(!g)return;F.genres.has(g)?F.genres.delete(g):F.genres.add(g);e.target.classList.toggle('on');run()};
  for(const k of ['sort','format','status','season','year']) $('#f-'+k).onchange=e=>{F[k]=e.target.value;run()};
  $('#f-score').oninput=e=>$('#scoreV').textContent=e.target.value;
  $('#f-score').onchange=e=>{F.score=+e.target.value;run()};
  $('#reset').onclick=()=>{Object.assign(F,{sort:'TRENDING_DESC',format:'',status:'',season:'',year:'',score:0,q:''});F.genres.clear();
    $('#q').value='';$$('.filters select').forEach(s=>s.selectedIndex=0);$('#f-score').value=0;$('#scoreV').textContent=0;$$('.chip.on').forEach(c=>c.classList.remove('on'));run()};
  $('#ftoggle').onclick=()=>$('#filters').classList.toggle('open');
  let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{
    if(view==='list'){$('#lq').value=e.target.value;renderList();return}
    if(view==='week'||view==='stats')setView('discover');
    F.q=e.target.value.trim();run()},350)};
  $('#more').onclick=()=>{page++;load(true)};
})();

function vars(){
  const v={page,perPage:24,sort:[F.sort]};
  if(F.q){v.search=F.q.replace(/[’‘`´]/g,"'");v.sort=['SEARCH_MATCH']}
  if(F.format)v.format=F.format; if(F.status)v.status=F.status; if(F.season)v.season=F.season;
  if(F.year)v.seasonYear=+F.year; if(F.score)v.score=F.score; if(F.genres.size)v.genre_in=[...F.genres];
  return v;
}
/* punctuation-tolerant search */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]+/gu,'');
function searchVariants(q){
  const base=q.replace(/[’‘`´]/g,"'");
  const spaced=base.replace(/[^\p{L}\p{N}\s]+/gu,' ');
  return [base,base.replace(/'\w*/g,''),spaced,spaced.replace(/\b(\p{L}{3,})s\b/gu,'$1')]
    .map(s=>s.replace(/\s+/g,' ').trim()).filter((s,i,a)=>s&&a.indexOf(s)===i);
}
function run(){page=1;$('#grid').innerHTML='';updateFcount();load(false)}
function updateFcount(){const n=F.genres.size+['format','status','season','year'].filter(k=>F[k]).length+(F.score?1:0);$('#fcount').textContent=n?`(${n})`:''}
async function load(append){
  if(loading)return;loading=true;
  const g=$('#grid');
  if(!append)g.innerHTML=Array(12).fill('<div class="skel"></div>').join('');
  $('#more').style.display='none';
  try{
    let p=await anilist(vars());
    if(!p.media.length&&F.q&&!append){ // relax punctuation step by step until something matches
      for(const s of searchVariants(F.q).slice(1)){
        const v=vars();v.search=s;p=await anilist(v);if(p.media.length)break;
      }
    }
    const items=p.media.map(slim);items.forEach(m=>cache[m.id]=m);
    if(!append)g.innerHTML='';
    g.insertAdjacentHTML('beforeend',items.map(m=>cardHTML(m)).join(''));
    if(!g.children.length)g.innerHTML='<div class="empty" style="grid-column:1/-1">No anime match.<br><span class="hint">Try fewer filters (a minimum score hides brand-new shows) or tap Reset filters.</span></div>';
    hasNext=p.pageInfo.hasNextPage;$('#more').style.display=hasNext?'block':'none';
    $('#resCount').textContent=p.pageInfo.total?`${p.pageInfo.total.toLocaleString()} results`:'';
  }catch(e){
    if(!append)g.innerHTML=`<div class="empty" style="grid-column:1/-1">⚠ ${esc(e.message)}<br><br><button class="btn" onclick="run()">Retry</button></div>`;else toast(e.message);
  }
  loading=false;
}

/* ---------- cards ---------- */
const scoreCls=s=>s>=75?'s':s>=60?'m':'l';
function cardHTML(m,showProg){
  const e=list[m.id],inList=!!e;
  const meta=[m.format?.replace('_',' '),m.year,m.episodes?m.episodes+' ep':null].filter(Boolean).join(' · ');
  const pct=showProg&&m.episodes?Math.min(100,(e.progress||0)/m.episodes*100):0;
  return `<div class="card" data-id="${m.id}">
    <div class="cover" style="background-image:url('${esc(m.cover)}');background-color:${esc(m.color||'')}" data-open="${m.id}">
      ${showProg&&e?.myScore&&settings.rate!==false?`<span class="badge mine">♥ ${e.myScore/10}</span>`
        :m.score?`<span class="badge ${scoreCls(m.score)}">★ ${(m.score/10).toFixed(1)}</span>`:''}
      ${showProg&&ACTIVE.includes(e.status)&&nextInfo(e).out&&!(e.episodes&&e.progress>=e.episodes)
        ?`<button class="add plus" data-plus="${m.id}" aria-label="Mark episode ${(e.progress||0)+1} watched">+1</button>`
        :`<button class="add ${inList?'in':''}" data-add="${m.id}" aria-label="${inList?'In list':'Add to list'}">${inList?'✓':'+'}</button>`}
      <div class="cinfo"><div class="ctitle">${esc(titleOf(m))}</div><div class="cmeta">${esc(meta)}${showProg&&(ACTIVE.includes(e.status)||e.status==='paused')?` · ep ${e.progress||0}`:''}</div></div>
    </div>${showProg&&m.episodes?`<div class="prog"><i style="width:${pct}%"></i></div>`:''}</div>`;
}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-plus]');if(p){e.stopPropagation();plusOne(+p.dataset.plus);return}
  const a=e.target.closest('[data-add]');
  if(a){e.stopPropagation();const id=+a.dataset.add;
    if(list[id])openModal(id);else{addToList(id,'planning');toast('Added to Plan to watch');refreshCards()}return}
  const o=e.target.closest('[data-open]');if(o)openModal(+o.dataset.open);
});
// "in 3h" within a day, otherwise "Tue 17:00"
function whenText(sec){
  const d=sec*1000-Date.now();if(d<=0)return 'now';
  if(d<36e5)return 'in '+Math.max(1,Math.round(d/6e4))+'m';
  if(d<864e5)return 'in '+Math.round(d/36e5)+'h';
  return new Date(sec*1000).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});
}
// Next episode for a list item: is it out yet, and how many aired episodes are unwatched?
function nextInfo(x){
  const ep=(x.progress||0)+1,nx=x.next&&x.next.airingAt*1000>Date.now()?x.next:null;
  const aired=nx?nx.episode-1:x.mstatus==='NOT_YET_RELEASED'?0:(x.episodes||Infinity);
  return{ep,out:ep<=aired,behind:nx?aired-ep+1:0,nx}; // "N new" only makes sense for shows still airing
}
function renderNext(){

/* ---------- this week (airing schedule) ---------- */
// Episodes airing from the start of yesterday (to catch up) to 7 days after today, from AniList's airingSchedules (public, no account needed).
// "My shows" = list entries that are not completed/dropped; "All popular" = everything airing with popularity >= 10k.
// Note: AniList answers 500 if mediaId_in is passed as null, so the "All popular" query leaves the argument out.
const WK_Q=withIds=>`query($p:Int,${withIds?'$ids:[Int],':''}$from:Int,$to:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage}
airingSchedules(${withIds?'mediaId_in:$ids,':''}airingAt_greater:$from,airingAt_lesser:$to,sort:TIME){episode airingAt media{isAdult ${QUERY.slice(QUERY.indexOf('id idMal'),QUERY.lastIndexOf('}}}'))}}}}}`;
let wkMode='mine',wkData=null,wkKey='',wkAt=0;
const wkIds=()=>Object.values(list).filter(x=>x.status!=='completed'&&x.status!=='dropped').map(x=>x.id).sort((a,b)=>a-b);
async function loadWeek(force){
  const ids=wkMode==='mine'?wkIds():null,key=wkMode+':'+(ids||[]).join(',');
  if(!force&&wkData&&key===wkKey&&Date.now()-wkAt<6e5)return drawWeek();
  const day0=new Date();day0.setHours(0,0,0,0);const from=Math.floor(day0/1000)-86400-1,to=from+8*86400+1; // yesterday + 7 days
  if(ids&&!ids.length){wkData=[];wkKey=key;wkAt=Date.now();return drawWeek()}
  $('#wk').innerHTML='<div class="empty">Loading schedule…</div>';
  try{
    const out=[];
    for(let p=1;p<=10;p++){
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:WK_Q(!!ids),variables:ids?{p,ids,from,to}:{p,from,to}})});
      if(!r.ok)throw new Error(r.status===429?'Rate limited, wait a moment':'AniList error '+r.status);
      const pg=(await r.json()).data.Page;
      for(const s of pg.airingSchedules){
        if(!s.media||s.media.isAdult||(!ids&&(s.media.popularity||0)<1e4))continue;
        const m=slim(s.media);cache[m.id]=cache[m.id]||m;
        if(list[m.id])Object.assign(list[m.id],freshMedia(s.media));
        out.push({ep:s.episode,at:s.airingAt,m});
      }
      if(!pg.pageInfo.hasNextPage)break;
    }
    wkData=out;wkKey=key;wkAt=Date.now();drawWeek();
  }catch(e){$('#wk').innerHTML=`<div class="empty">⚠ ${esc(e.message)}<br><br><button class="btn" onclick="loadWeek(true)">Retry</button></div>`}
}
function drawWeek(){
  if(!wkData)return;
  if(!wkData.length){$('#wk').innerHTML=`<div class="empty">${wkMode==='mine'?'Nothing from your list airs this week.<br><span class="hint">Add airing shows from Discover (Filters → Status: Airing), or tap <b>All popular</b>.</span>':'Nothing found for this week.'}</div>`;return}
  const now=Date.now()/1000,dayKey=t=>new Date(t*1000).toDateString(),today=dayKey(now),tmr=dayKey(now+86400),yst=dayKey(now-86400);
  let html='',cur='';
  for(const s of wkData){
    const k=dayKey(s.at);
    if(k!==cur){cur=k;const d=new Date(s.at*1000);
      html+=`<div class="wkday${k===today?' today':''}">${k===today?'Today':k===tmr?'Tomorrow':k===yst?'Yesterday':d.toLocaleDateString([],{weekday:'long'})} · ${d.toLocaleDateString([],{day:'numeric',month:'short'})}</div>`}
    const e=list[s.m.id],aired=s.at<=now,prog=e?.progress||0;
    let note,act='';
    if(!aired)note=s.at-now<86400?'Airs '+whenText(s.at):'Upcoming';
    else if(e&&prog>=s.ep)note='<span class="ok">Watched ✓</span>';
    else if(e){note='<span class="new">Out now</span>'+(s.ep-prog>1?` · ${s.ep-prog} to catch up`:'');
      act=`<button class="plus" data-plus="${s.m.id}" aria-label="Mark episode ${prog+1} watched">+1</button>`}
    else note='Out now';
    if(!e)act=`<button class="plus" data-add="${s.m.id}" aria-label="Add to list" style="background:var(--card2);border:1px solid var(--line);color:var(--text)">+</button>`;
    html+=`<div class="wkrow${aired?' past':''}" data-open="${s.m.id}"><span class="t">${new Date(s.at*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
      <div class="nuimg" style="background-image:url('${esc(s.m.cover)}')"></div>
      <div class="grow"><div class="ctitle">${esc(titleOf(s.m))}</div><div class="cmeta">Ep ${s.ep}${s.m.episodes?' / '+s.m.episodes:''} · ${note}</div></div>${act}</div>`;
  }
  $('#wk').innerHTML=html;
}

// Refresh airing info (next episode, episode count) for unfinished shows in the list, also without an account.
// Uses the public AniList API, max once per 30 min unless a stored "next episode" time has passed.
const AIR_Q=`query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME){${QUERY.slice(QUERY.indexOf('id idMal'),QUERY.lastIndexOf('}}}'))}}}}`;
async function refreshAiring(force){
  const its=Object.values(list).filter(x=>x.status!=='completed'&&x.status!=='dropped'&&(x.next||x.mstatus!=='FINISHED'));
  const stale=its.some(x=>x.next&&x.next.airingAt*1000<Date.now());
  if(!its.length||(!force&&!stale&&Date.now()-(store.get('kuro.airAt',0))<18e5))return;
  try{
    for(let i=0;i<its.length;i+=50){
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:AIR_Q,variables:{ids:its.slice(i,i+50).map(x=>x.id)}})});
      if(!r.ok)return;
      for(const m of (await r.json()).data.Page.media)if(list[m.id])Object.assign(list[m.id],freshMedia(m));
    }
    store.set(listKey(),list);store.set('kuro.airAt',Date.now());renderNext();redrawList();
  }catch{}
}

// Change episode progress by d. Going up: the last episode completes the show; a planned/paused/dropped show becomes Watching.
// Returns the previous {status,progress} so the change can be undone.
function bump(id,d){
  const e=list[id];if(!e)return null;const prev={status:e.status,progress:e.progress||0};
  const tot=e.episodes||details[id]?.episodes||0;
  e.progress=Math.max(0,Math.min(tot||9999,(e.progress||0)+d));
  if(d>0&&tot&&e.progress>=tot)e.status='completed';
  else if(d>0&&['planning','paused','dropped'].includes(e.status))e.status='watching';
  e.updated=Date.now();saveList();refreshCards();
  return prev;
}

function plusOne(id){
  const prev=bump(id,1),e=list[id];if(!prev)return;
  const done=e.status==='completed'&&prev.status!=='completed';

}

}
const okUrl=u=>/^https?:\/\//i.test(u||'');
function epNum(s,i){const m=/(?:episode|ep\.?)\s*(\d+)/i.exec(s.title||'');return m?+m[1]:i+1}
function wtwHTML(d){
  const seen=new Set();
  const links=(d.externalLinks||[]).filter(l=>l.type==='STREAMING'&&!l.isDisabled&&okUrl(l.url)&&!seen.has(l.site)&&seen.add(l.site));
  return links.length?links.map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener" style="border-left:4px solid ${/^#[0-9a-f]{3,8}$/i.test(l.color||'')?l.color:'var(--accent)'}">${esc(l.site)}</a>`).join(''):'<span class="hint">No official streaming links are listed for this title yet.</span>';
}
function epsHTML(id,d){
  const m=cache[id]||list[id],prog=list[id]?.progress||0,meta={};
  (d.streamingEpisodes||[]).forEach((s,i)=>{const n=epNum(s,i);if(!meta[n])meta[n]=s});
  const keys=Object.keys(meta).map(Number);
  const n=m.episodes||d.episodes||(d.nextAiringEpisode?d.nextAiringEpisode.episode-1:0)||Math.max(prog,...keys,0);
  if(!n)return '<span class="hint">Episode count not known yet.</span>';
  const win=n>60&&!epAll,from=win?Math.max(1,prog-2):1,to=win?Math.min(n,from+59):n;
  let h=win?`<div class="hint" style="margin-bottom:6px">Showing episodes ${from}–${to} of ${n}</div>`:'';
  if(keys.length){
    for(let k=from;k<=to;k++){
      const s=meta[k],t=(s?.title||'').replace(/^\s*Episode\s*\d+\s*[-–:]?\s*/i,'')||'Episode '+k;
      h+=`<div class="ep ${k<=prog?'done':''}" data-ep="${k}"><div class="epth" style="${s&&okUrl(s.thumbnail)?`background-image:url('${esc(s.thumbnail)}')`:''}"></div><div class="epm"><b>${k}</b> ${esc(t)}</div>${s&&okUrl(s.url)?`<a class="epw" href="${esc(s.url)}" target="_blank" rel="noopener" title="Watch on ${esc(s.site)}">▶</a>`:''}<span class="tick">${k<=prog?'✓':''}</span></div>`;
    }
  }else{
    h+='<div class="epg">';for(let k=from;k<=to;k++)h+=`<button class="epc ${k<=prog?'done':''}" data-ep="${k}">${k}</button>`;h+='</div>';
  }
  if(win)h+=`<button class="btn" id="epall" style="margin-top:8px">Show all ${n} episodes</button>`;
  return h;
}
function fillDetails(id){
  loadDetails(id).then(d=>{
    if(curModal!==id||!$('#eps'))return;
    if(!d){$('#wtwb').innerHTML=$('#eps').innerHTML='<span class="hint">Couldn’t load details. Check your connection.</span>';return}
    $('#wtwb').innerHTML=wtwHTML(d);$('#eps').innerHTML=epsHTML(id,d);
    if(keepTop!=null)$('#modal').scrollTop=keepTop;
  });
}
function epTap(id,k){
  if(!list[id])addToList(id,'watching');
  const e=list[id],tot=e.episodes||details[id]?.episodes||0;
  e.progress=e.progress===k?k-1:k;
  if(tot&&e.progress>=tot)e.status='completed';
  else if(e.progress>0&&['planning','dropped','completed','paused'].includes(e.status))e.status='watching';
  e.updated=Date.now();saveList();refreshCards();openModal(id,true);
}
$('#modal').addEventListener('click',ev=>{
  if(ev.target.id==='epall'){epAll=true;keepTop=$('#modal').scrollTop;fillDetails(curModal);return}
  const row=ev.target.closest('[data-ep]');

// Crop an image file to a centred square and shrink it to a small JPEG data URL (stays in localStorage, never uploaded)
function squareJpeg(file,size){
  return new Promise((ok,fail)=>{const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
    img.onerror=()=>{URL.revokeObjectURL(url);fail()};img.src=url});
}

function toast(t,undo){
  const el=$('#toast');el.innerHTML=`<span class="tt">${esc(t)}</span>`+(undo?'<button class="link" id="undo">Undo</button>':'');
  el.classList.add('show');el.classList.toggle('act',!!undo);clearTimeout(toast.t);
  if(undo)$('#undo').onclick=()=>{undo();el.classList.remove('show','act')};
  toast.t=setTimeout(()=>el.classList.remove('show','act'),undo?5000:2200);
}

/* ---------- AniList sync ---------- */
const SMAP={planning:'PLANNING',watching:'CURRENT',repeating:'REPEATING',paused:'PAUSED',completed:'COMPLETED',dropped:'DROPPED'};
const RMAP=Object.fromEntries(Object.entries(SMAP).map(([k,v])=>[v,k]));
const MEDIA_FIELDS=QUERY.slice(QUERY.indexOf('id idMal'),QUERY.lastIndexOf('}}}'));
// myScore (0-100, AniList scoreRaw / POINT_100) and notes are the user's own rating and notes
const COLL=`query($userId:Int){MediaListCollection(userId:$userId,type:ANIME){lists{entries{id mediaId status progress score(format:POINT_100) notes updatedAt media{${MEDIA_FIELDS}}}}}}`;
const SAVE=`mutation($mediaId:Int,$status:MediaListStatus,$progress:Int,$scoreRaw:Int,$notes:String){SaveMediaListEntry(mediaId:$mediaId,status:$status,progress:$progress,scoreRaw:$scoreRaw,notes:$notes){id}}`;
const DEL=`mutation($id:Int){DeleteMediaListEntry(id:$id){deleted}}`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gql(query,variables,token=me()?.token){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json',Authorization:'Bearer '+token},body:JSON.stringify({query,variables})});
  if(r.status===401)throw new Error('AUTH');
  if(r.status===429){await sleep(5000);return gql(query,variables,token)}
  const j=await r.json();
  if(j.errors){const m=j.errors[0].message||'';if(/invalid token|unauthori[sz]ed/i.test(m))throw new Error('AUTH');throw new Error(m)} // AniList answers bad tokens with 400 "Invalid token"
  return j.data;
}
const unsynced=()=>Object.values(list).filter(it=>!it.synced||it.updated>it.synced).length+(me()?.pendingDel?.length||0);
const VIEWER_Q='{Viewer{id name avatar{large medium} bannerImage}}';
const viewerInfo=v=>({id:v.id,name:v.name,avatar:v.avatar?.medium||'',avatarL:v.avatar?.large||v.avatar?.medium||'',banner:v.bannerImage||'',infoAt:Date.now()});
let syncing=false,syncAgain=false,syncT;
function scheduleSync(){if(!me()?.token)return;clearTimeout(syncT);syncT=setTimeout(()=>sync(false),2500)}
async function sync(manual){
  const p=me();if(!p?.token)return;
  if(syncing){syncAgain=true;return}
  syncing=true;syncAgain=false;
  try{
    // 1. removals made on this browser (queued so they survive being offline)
    p.pendingDel=p.pendingDel||[];
    while(p.pendingDel.length){
      try{await gql(DEL,{id:p.pendingDel[0]})}catch(e){if(e.message==='AUTH'||e instanceof TypeError)throw e} // other errors: entry already gone
      p.pendingDel.shift();saveProfiles();await sleep(700);
    }
    // AniList name / picture / banner, refreshed once a day
    if(Date.now()-(p.infoAt||0)>864e5){Object.assign(p,viewerInfo((await gql(VIEWER_Q)).Viewer));saveProfiles();renderProfileBtn()}
    // 2. pull: newest change wins per entry
    const d=await gql(COLL,{userId:p.id});
    const remote={};
    for(const l of d.MediaListCollection.lists)for(const e of l.entries)remote[e.mediaId]=e;
    for(const e of Object.values(remote)){
      const loc=list[e.mediaId],ms=e.updatedAt*1000;
      // remote wins if newer; on an equal time the local copy is unchanged since the last pull, so remote status is
      // authoritative (fixes entries that older versions stored as 'watching' for PAUSED/REPEATING)
      if(!loc||ms>(loc.updated||0)||(ms===loc.updated&&RMAP[e.status]&&RMAP[e.status]!==loc.status)){
        list[e.mediaId]={...slim(e.media),status:RMAP[e.status]||'planning',progress:e.progress||0,myScore:Math.round(e.score||0),notes:e.notes||'',added:loc?.added||ms||Date.now(),updated:ms,synced:Date.now(),entryId:e.id};
      }else{
        Object.assign(loc,freshMedia(e.media)); // fresh airing info, episode count etc.; does not count as a local change
        if(!loc.entryId)loc.entryId=e.id;
        if(loc.myScore===undefined&&loc.notes===undefined){loc.myScore=Math.round(e.score||0);loc.notes=e.notes||''} // entries pulled before ratings existed
      }
    }
    // removed on another browser/device: drop entries that were in sync here but are gone on AniList
    for(const [k,it] of Object.entries(list))if(!remote[k]&&it.entryId&&it.synced&&it.updated<=it.synced)delete list[k];
    store.set(listKey(),list);updateCounts();refreshCards();
    // 3. push local changes
    for(const it of Object.values(list)){
      if(it.synced&&it.updated<=it.synced)continue;
      const v={mediaId:it.id,status:SMAP[it.status],progress:it.progress||0};
      if(it.myScore!==undefined)v.scoreRaw=it.myScore||0; // never send a score/notes Kuro does not know, so AniList's are not wiped
      if(it.notes!==undefined)v.notes=it.notes||'';
      const r=await gql(SAVE,v);
      it.entryId=r.SaveMediaListEntry.id;it.synced=Date.now();store.set(listKey(),list);await sleep(700);
    }
    p.lastSync=Date.now();saveProfiles();
    if(manual)toast('Synced ✓');
  }catch(e){
    if(e.message==='AUTH'){delete p.token;saveProfiles();renderProfileBtn();toast(`AniList sign-in expired for ${p.name}, sign in again in Settings`)}
    else toast('Sync failed: '+(e instanceof TypeError?'offline?':e.message));
  }
  syncing=false;
  if(syncAgain)scheduleSync();
}
// Back from AniList sign-in: the token arrives in the URL hash. Work out which account it is,
// store it as a profile, offer to move the guest list into it, then switch to it.
const authing=(async function handleAuth(){
  const tok=new URLSearchParams(location.hash.slice(1)).get('access_token')||pendingTok;
  if(!tok)return false;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const v=(await gql(VIEWER_Q,{},tok)).Viewer;
    const isNew=!profiles[v.id];
    profiles[v.id]={...profiles[v.id],...viewerInfo(v),token:tok};saveProfiles();
    const guest=store.get('kuro.list',{}),n=Object.keys(guest).length;
    if(isNew&&n&&confirm(`Add the ${n} title${n>1?'s':''} saved in this browser without an account to ${v.name}'s list?`)){
      const mine=store.get('kuro.list.'+v.id,{});
      for(const it of Object.values(guest)){delete it.synced;delete it.entryId}
      store.set('kuro.list.'+v.id,{...guest,...mine});store.del('kuro.list');
    }
    switchProfile(v.id,'Signed in as '+v.name);
  }catch(e){toast('AniList sign-in failed: '+(e.message==='AUTH'?'token rejected':e.message))}
  return true;
})();

function renderProfileBtn(){
  const p=me(),b=$('#settingsBtn'),l=look(p);applyPrefs();
  if(!p&&!l.custom)return; // plain guest: keep the gear icon
  b.classList.add('me');b.title=l.name+(p&&!p.token?' (signed out, sign in again in Settings)':'');b.setAttribute('aria-label','Profile and settings');
  b.innerHTML=l.av();b.classList.toggle('expired',!!p&&!p.token);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;refreshAiring();renderNext();if(me()?.token&&Date.now()-(me().lastSync||0)>60000)sync(false)});

renderProfileBtn();updateCounts();renderNext();setView('discover');load(false);
authing.then(a=>{if(!a&&me()?.token)sync(false)});
refreshAiring();
try{const m=sessionStorage.getItem('kuro.toast');if(m){sessionStorage.removeItem('kuro.toast');toast(m)}}catch{}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
