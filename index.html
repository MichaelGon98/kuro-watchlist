/* ----- "From your shows": sequels and prequels of shows you watched that are not on your list.
   New announcements (not seen before) get a "New" badge, a toast and, when alerts are on, a notification. ----- */
const REL_Q=`query($p:Int,$ids:[Int]){Page(page:$p,perPage:50){pageInfo{hasNextPage}media(id_in:$ids,type:ANIME){id relations{edges{relationType node{type isAdult startDate{year month day} ${MEDIA_FIELDS}}}}}}}`;
const relKey=()=>'kuro.rel.'+prefKey(),relSeenKey=()=>'kuro.relSeen.'+prefKey();
let relBusy=false;
function relLabel(o){const m=o.m,sd=o.sd||{};
  if(m.status==='RELEASING')return[0,'Airing now'];
  if(m.status==='NOT_YET_RELEASED'){
    if(sd.year&&sd.month){const d=new Date(sd.year,sd.month-1,sd.day||1);return[1,'Starts '+(sd.day?d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'}):d.toLocaleDateString([],{month:'long',year:'numeric'})),d.getTime()]}
    return[2,sd.year?'Coming in '+sd.year:'Announced',sd.year?new Date(sd.year,11,31).getTime():9e15]}
  if(m.status==='HIATUS')return[5,'On hiatus'];
  return o.rel==='SEQUEL'?[3,'Out now, not seen yet']:[4,'Prequel you have not seen'];
}
async function loadRels(){
  const seeds=Object.values(list).filter(x=>['completed','watching','repeating','paused'].includes(x.status)).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,150);
  const key=seeds.map(x=>x.id).sort((a,b)=>a-b).join(),c=store.get(relKey(),null);
  if(!seeds.length){store.del(relKey());return drawRels()}
  if(relBusy||(c&&c.key===key&&Date.now()-c.at<12*36e5))return drawRels();
  relBusy=true;
  try{
    const ids=seeds.map(x=>x.id),found=new Map();
    for(let i=0;i<ids.length;i+=50){
      const pg=(await pubQ(REL_Q,{p:1,ids:ids.slice(i,i+50)})).Page;
      for(const sm of pg.media)for(const ed of sm.relations?.edges||[]){const n=ed.node;
        if(n.type!=='ANIME'||n.isAdult||!['SEQUEL','PREQUEL'].includes(ed.relationType))continue;
        const prev=found.get(n.id);if(prev&&prev.rel==='SEQUEL')continue;
        found.set(n.id,{rel:ed.relationType,src:sm.id,sd:n.startDate,m:slim(n)})}
    }
    store.set(relKey(),{key,at:Date.now(),items:[...found.values()]});
    // new announcements: upcoming or airing sequels we have not shown before (the first run only learns, so nothing floods in)
    const seenRaw=store.get(relSeenKey(),null),seen=new Set(seenRaw||[]),fresh=[];
    for(const o of found.values())if(!seen.has(o.m.id)){if(seenRaw&&o.rel==='SEQUEL'&&relLabel(o)[0]<=2)fresh.push(o);seen.add(o.m.id)}
    store.set(relSeenKey(),[...seen]);
    if(fresh.length){
      const h=store.get('kuro.relNew.'+prefKey(),{});for(const o of fresh)h[o.m.id]=Date.now();store.set('kuro.relNew.'+prefKey(),h);
      const t=fresh.length===1?`New: a sequel to ${titleOf(list[fresh[0].src]||{title:{}})}`:`${fresh.length} new sequels to shows you watched`;
      toast(t);
      if(alertsOn())(await navigator.serviceWorker.ready).showNotification(t,{body:fresh.map(o=>titleOf(o.m)).slice(0,3).join(' · '),icon:'icon-192.png',badge:'favicon-32.png',tag:'kuro-rel',data:{id:fresh[0].m.id}});
    }
  }catch{}
  relBusy=false;drawRels();
}
function drawRels(){
  const c=store.get(relKey(),null),newMap=store.get('kuro.relNew.'+prefKey(),{});
  const its=(c?.items||[]).filter(o=>!list[o.m.id]||newMap[o.m.id]).map(o=>{cache[o.m.id]=cache[o.m.id]||o.m;const[r,l,t]=relLabel(o);return{...o,r,l,t:t||0}})
    .filter(o=>list[o.src]).sort((a,b)=>a.r-b.r||a.t-b.t||(b.m.pop||0)-(a.m.pop||0)).slice(0,16);
  $('#rels').style.display=its.length?'':'none';
  $('#relRow').innerHTML=its.map(o=>{const isNew=Date.now()-(newMap[o.m.id]||0)<14*DAY;
    return `<div class="relc">${cardHTML(o.m)}<div class="relwhy"><b>${isNew?'<span class="newb">New</span>':''}${esc(o.l)}</b>${o.rel==='SEQUEL'?'Sequel to':'Prequel to'} ${esc(titleOf(list[o.src]))}</div></div>`}).join('');
}

/* ================= Phase 3: diary, streaks, badges, Wrapped ================= */
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const shiftDay=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const hEps=h=>h[3]-h[2]+1;
const fmtN=n=>Math.floor(n).toLocaleString();
const dateTxt=(t,o={})=>new Date(t).toLocaleDateString([],{day:'numeric',month:'short',...(new Date(t).getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{}),...o});
function dayMap(H=hist){const m=new Map();for(const h of H){const k=dayStart(h[0]);m.set(k,(m.get(k)||0)+hEps(h))}return m}
// current streak counts back from today (or from yesterday, so a streak is not "lost" before you watch today)
function streaks(days){
  const ks=[...days.keys()].sort((a,b)=>a-b);let best=0,run=0,prev=null;
  for(const k of ks){run=prev!=null&&shiftDay(prev,1)===k?run+1:1;best=Math.max(best,run);prev=k}
  const t0=dayStart(Date.now());let d=days.has(t0)?t0:shiftDay(t0,-1),cur=0;while(days.has(d)){cur++;d=shiftDay(d,-1)}
  return{cur,best,today:days.has(t0)};
}

/* ----- Diary: what you marked watched, day by day ----- */
function epsText(eps){const a=[...new Set(eps)].sort((x,y)=>x-y),r=[];
  for(const e of a){const l=r[r.length-1];if(l&&e===l[1]+1)l[1]=e;else r.push([e,e])}
  return (a.length>1?'Eps ':'Ep ')+r.map(([x,y])=>x===y?x:`${x}–${y}`).join(', ')}
function drawDiary(){
  if(!hist.length){$('#stats').innerHTML=`<div class="empty">Your diary is empty for now.<br><span class="hint">Every episode you mark watched (+1, the episode stepper or the episode list) is written here, with your streaks and a calendar.</span></div>`;return}
  const days=dayMap(),st=streaks(days),t0=dayStart(Date.now()),now=new Date(t0);
  const mon=shiftDay(t0,-((now.getDay()+6)%7)),month1=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const sumFrom=f=>{let n=0;for(const[k,v]of days)if(k>=f)n+=v;return n};
  const tile=(l,v,sub)=>`<div class="tile"><small>${l}</small><b>${v}</b>${sub?`<span>${sub}</span>`:''}</div>`;
  const W=18,from=shiftDay(mon,-7*(W-1));let cells='';
  for(let i=0,d=from;i<W*7;i++,d=shiftDay(d,1)){const n=days.get(d)||0,fut=d>t0,lv=fut?'f':n>=7?4:n>=4?3:n>=2?2:n?1:0;
    cells+=`<i class="l${lv}"${fut?'':` title="${esc(dateTxt(d,{weekday:'short'}))}: ${n?n+' episode'+(n>1?'s':''):'nothing'}"`}></i>`}
  // timeline, newest day first; one row per show per day
  const byDay=new Map();for(let i=hist.length-1;i>=0;i--){const h=hist[i],k=dayStart(h[0]);if(!byDay.has(k))byDay.set(k,new Map());
    const g=byDay.get(k);if(!g.has(h[1]))g.set(h[1],{eps:[],t:h[0]});const o=g.get(h[1]);for(let e=h[2];e<=h[3];e++)o.eps.push(e)}
  const keys=[...byDay.keys()],shown=keys.slice(0,diaryDays);
  const label=k=>k===t0?'Today':k===shiftDay(t0,-1)?'Yesterday':dateTxt(k,{weekday:'long'});
  const tl=shown.map(k=>{const g=byDay.get(k),tot=days.get(k)||0;
    return `<div class="dday"><span>${label(k)}</span><span>${tot} ep${tot>1?'s':''}</span></div>`+[...g].map(([id,o])=>{const m=list[id]||cache[id];
      return `<div class="drow"${m?` data-open="${id}"`:''}>${pic(m?.cover,'nuimg')}<div class="grow"${m?' role="button" tabindex="0"':''}><div class="ctitle">${esc(m?titleOf(m):'A show no longer on your list')}</div>
        <div class="cmeta">${epsText(o.eps)} · ${new Date(o.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div><span class="dn">${new Set(o.eps).size}</span></div>`}).join('')}).join('');
  $('#stats').innerHTML=`
    <div class="tiles">
      ${tile('This week',sumFrom(mon),'episodes')}${tile('This month',sumFrom(month1),'episodes')}
      ${tile('Current streak',st.cur+(st.cur===1?' day':' days'),st.cur&&!st.today?'watch today to keep it':st.today?'🔥 watched today':'')}
      ${tile('Longest streak',st.best+(st.best===1?' day':' days'),'')}
    </div>
    <h2 class="sec" style="margin-top:22px">Last ${W} weeks</h2>
    <div class="spanel"><div class="heat" role="img" aria-label="Calendar of episodes watched per day over the last ${W} weeks">${cells}</div>
      <div class="heatleg">Less <i style="background:var(--card2)"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div></div>
    <h2 class="sec" style="margin-top:22px">Diary</h2>${tl}
    ${keys.length>shown.length?`<button class="more" id="diaryMore">Show older days</button>`:''}
    <div class="hint" style="margin-top:14px">Kept in this browser since ${dateTxt(hist[0][0],{year:'numeric'})}. Changing a show's status (e.g. to Completed) is not counted as watching.</div>`;
}
