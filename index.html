/* ----- Diary: what you marked watched, day by day ----- */
function epsText(eps){const a=[...new Set(eps)].sort((x,y)=>x-y),r=[];
  for(const e of a){const l=r[r.length-1];if(l&&e===l[1]+1)l[1]=e;else r.push([e,e])}
  return (a.length>1?'Eps ':'Ep ')+r.map(([x,y])=>x===y?x:`${x}–${y}`).join(', ')}
function drawDiary(){const hist=histV();
  if(!hist.length){$('#stats').innerHTML=`<div class="empty">Your diary is empty for now.<br><span class="hint">Every episode you mark watched (+1, the episode stepper or the episode list) is written here, with your streaks and a calendar.</span></div>`;return}
  const days=dayMap(),st=streaks(days),t0=dayStart(Date.now()),now=new Date(t0);
  const mon=shiftDay(t0,-((now.getDay()+6)%7)),month1=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const sumFrom=f=>{let n=0;for(const[k,v]of days)if(k>=f)n+=v;return n};
  const tile=(l,v,sub)=>`<div class="tile"><small>${l}</small><b>${v}</b>${sub?`<span>${sub}</span>`:''}</div>`;
  const W=18,from=shiftDay(mon,-7*(W-1));let cells='';
  for(let i=0,d=from;i<W*7;i++,d=shiftDay(d,1)){const n=days.get(d)||0,fut=d>t0,lv=fut?'f':n>=7?4:n>=4?3:n>=2?2:n?1:0;
    cells+=`<i class="l${lv}"${fut?'':` title="${esc(dateTxt(d,{weekday:'short'}))}: ${n?n+' episode'+(n>1?'s':''):'nothing'}"`}></i>`}
  // timeline, newest day first; one row per show per day
  const byDay=new Map();for(let i=hist.length-1;i>=0;i--){const h=hist[i],k=dayStart(h[0]);if(!byDay.has(k))byDay.set(k,new Map());
    const g=byDay.get(k);if(!g.has(h[1]))g.set(h[1],{eps:[],t:h[0],rx:[]});const o=g.get(h[1]);for(let e=h[2];e<=h[3];e++)o.eps.push(e);if(h[4])o.rx.unshift(h[4])}
  const keys=[...byDay.keys()],shown=keys.slice(0,diaryDays);
  const label=k=>k===t0?'Today':k===shiftDay(t0,-1)?'Yesterday':dateTxt(k,{weekday:'long'});
  const tl=shown.map(k=>{const g=byDay.get(k),tot=days.get(k)||0;
    return `<div class="dday"><span>${label(k)}</span><span>${tot} ep${tot>1?'s':''}</span></div>`+[...g].map(([id,o])=>{const m=list[id]||cache[id];
      return `<div class="drow"${m?` data-open="${id}"`:''}>${pic(m?.cover,'nuimg')}<div class="grow"${m?' role="button" tabindex="0"':''}><div class="ctitle">${esc(m?titleOf(m):'A show no longer on your list')}</div>
        <div class="cmeta">${epsText(o.eps)} · ${new Date(o.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${o.rx.length?`<span class="drx" aria-label="Reactions">${o.rx.join('')}</span>`:''}</div></div><span class="dn">${new Set(o.eps).size}</span></div>`}).join('')}).join('');
  $('#stats').innerHTML=`
    <div class="tiles">
      ${tile('This week',sumFrom(mon),'episodes')}${tile('This month',sumFrom(month1),'episodes')}
      ${tile('Current streak',st.cur+(st.cur===1?' day':' days'),st.cur&&!st.today?'watch today to keep it':st.today?'🔥 watched today':'')}
      ${tile('Longest streak',st.best+(st.best===1?' day':' days'),'')}
    </div>
    <h2 class="sec" style="margin-top:22px">Last ${W} weeks</h2>
    <div class="spanel"><div class="heat" role="img" aria-label="Calendar of episodes watched per day over the last ${W} weeks">${cells}</div>
      <div class="heatleg">Less <i style="background:var(--card2)"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div></div>
    <h2 class="sec" style="margin-top:22px">Diary</h2>${tl}
    ${keys.length>shown.length?`<button class="more" id="diaryMore">Show older days</button>`:''}
    <div class="hint" style="margin-top:14px">Since ${dateTxt(hist[0][0],{year:'numeric'})}${me()?.token?': episodes you mark in Kuro plus your AniList activity, so every device signed in to this account shows the same diary':', kept in this browser'}. Changing a show's status (e.g. to Completed) is not counted as watching. Your Started / Finished dates decide the day.</div>`;
}

  for(const x of b)if(x.done&&!got[x.id]){got[x.id]=Date.now();fresh.push(x)}
  if(fresh.length||!had)store.set(badgeKey(),got);
  if(had&&fresh.length){bNew=null;if(partyOn())fxBadge(fresh);else toast(fresh.length===1?`Badge unlocked: ${fresh[0].ic} ${fresh[0].name}`:`${fresh.length} badges unlocked · see Stats → Badges`);if(view==='stats')drawStats()}
}

/* ----- Wrapped: a story of your year (or all time), with a shareable 1080×1920 image ----- */
const PERSONA={Action:['Adrenaline junkie','Big fights and bigger moments, you are here for the hype.'],Adventure:['Explorer','Always heading somewhere new, map in hand.'],
  Comedy:['Professional laugher','If it does not make you laugh, it is not worth the time.'],Drama:['Feels collector','You watch for the moments that hit hard.'],
  Fantasy:['World hopper','Swords, spells and other worlds are your second home.'],Romance:['Hopeless romantic','You are rooting for them. Always.'],
  'Slice of Life':['Cozy connoisseur','Tea, everyday life and quiet joy.'],Mystery:['Detective','You had the culprit figured out by episode 3.'],
  'Sci-Fi':['Future seeker','Robots, space and what comes next.'],Sports:['Team player','Training arcs and last-second wins.'],
  Horror:['Fearless','Lights off, volume up.'],Psychological:['Mind bender','The twistier, the better.'],Supernatural:['Spirit seeker','Ghosts, curses and things that go bump.'],
  Mecha:['Ace pilot','Giant robots. Need we say more?'],Music:['Idol fan','Every opening on repeat.'],Thriller:['Edge-of-seat','Cliffhangers are your cardio.'],
  'Mahou Shoujo':['Magical guardian','Transformation sequences, never skipped.']};
function wrapYears(){const ys=new Set(),hist=histV();for(const x of Object.values(list))if(x.status!=='planning'){const y=+(x.completedAt||x.startedAt||'').slice(0,4);ys.add(y||new Date(x.updated||x.added||Date.now()).getFullYear())}
  for(const h of hist)ys.add(new Date(h[0]).getFullYear());ys.add(new Date().getFullYear());return[...ys].sort((a,b)=>b-a)}
function wrapData(Y){const hist=histV();
  const all=Y==='all',start=all?0:new Date(Y,0,1).getTime(),end=all?Infinity:new Date(Y+1,0,1).getTime();
  const H=hist.filter(h=>h[0]>=start&&h[0]<end),hIds=new Set(H.map(h=>h[1]));
  const yr=v=>v?+v.slice(0,4):0,thisY=new Date().getFullYear();
  const inY=x=>{const a=yr(x.startedAt)||yr(x.completedAt),b=yr(x.completedAt)||(x.status==='completed'?a:thisY);
    return a?Y>=a&&Y<=b:(x.updated||0)>=start&&(x.updated||0)<end};
  const shows=Object.values(list).filter(x=>x.status!=='planning'&&(all||hIds.has(x.id)||inY(x)));
  // the day-by-day history only counts when it covers the whole year; otherwise use the shows you touched that year
  const full=!all&&hist.length&&hist[0][0]<=start;
  let eps=0,mins=0;const per=new Map();
  if(full){for(const h of H){const x=list[h[1]],n=hEps(h);eps+=n;const m=n*(x?.duration||24);mins+=m;per.set(h[1],(per.get(h[1])||0)+m)}}
  else for(const x of shows){const n=watchedEps(x);eps+=n;const m=n*(x.duration||24);mins+=m;per.set(x.id,m)}
  const gc={};for(const x of shows)for(const g of x.genres||[])gc[g]=(gc[g]||0)+1;
  const genres=Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const topId=[...per].sort((a,b)=>b[1]-a[1])[0],top=topId&&list[topId[0]]?{x:list[topId[0]],m:topId[1]}:null;
  const rated=shows.filter(x=>x.myScore>0&&settings.rate!==false).sort((a,b)=>b.myScore-a.myScore)[0]||null;
  const days=dayMap(H),bingeE=[...days].sort((a,b)=>b[1]-a[1])[0],st=streaks(days);
  const wd=[0,0,0,0,0,0,0];for(const[k,n]of days)wd[new Date(k).getDay()]+=n;const wdMax=wd.indexOf(Math.max(...wd));
  const completed=shows.filter(x=>x.status==='completed');
  const rc={};let wow=null;for(const h of H)if(h[4]){rc[h[4]]=(rc[h[4]]||0)+1;if(h[4]==='🤯')wow=h}
  const reacts=Object.entries(rc).sort((a,b)=>b[1]-a[1]);
  return{Y,all,full,shows,eps,mins,genres,top,rated,completed,reacts,wow,persona:PERSONA[genres[0]?.[0]]||['Anime fan','A little bit of everything, and that is the best way.'],
    binge:bingeE?{n:bingeE[1],at:bingeE[0]}:null,best:st.best,activeDays:days.size,wday:days.size?new Date(2024,0,7+wdMax).toLocaleDateString([],{weekday:'long'}):'',
    name:look(me()).name,since:hist[0]?.[0]};
}
let wr=null; // {d, i, slides, years}
function openWrapped(Y=new Date().getFullYear()){
  const d=wrapData(Y);wr={d,i:0,years:wrapYears(),slides:wrapSlides(d)};
  $('#modal').classList.add('wrm');$('#scrim').classList.add('open');document.body.style.overflow='hidden';curModal=null;
  wrDraw();
}
function wrapSlides(d){
  const yr=d.all?'all time':d.Y,S=[];const cov=x=>x?.cover?`<img class="wrcov" src="${esc(x.cover)}" alt="">`:'';
  const note=d.all?'':d.full?'':`<div class="hint">Counted from the shows you updated in ${d.Y}${d.since?`. Kuro has kept a day-by-day history since ${dateTxt(d.since,{year:'numeric'})}`:''}.</div>`;
  S.push(`<small>Kuro Wrapped</small><h1>${d.all?'Your anime story so far':`Your ${d.Y} in anime`}</h1><p>${esc(d.name)}</p>
    <div class="sub" style="justify-content:center;flex-wrap:wrap;margin-top:12px" role="group" aria-label="Which year">${[...wr?.years||wrapYears(),'all'].map(y=>`<button class="chip ${y===d.Y?'on':''}" data-wy="${y}" aria-pressed="${y===d.Y}">${y==='all'?'All time':y}</button>`).join('')}</div>
    <div class="hint" style="margin-top:10px">Tap the right side to continue</div>`);
  if(!d.shows.length){S.push(`<small>${yr}</small><h1>Nothing tracked yet</h1><p>Mark some episodes watched and come back for your Wrapped.</p>`);return S}
  const days=d.mins/1440;
  S.push(`<small>You watched</small><b class="big"><span class="count" data-to="${d.eps}">0</span></b><p>episodes</p>
    <p style="margin-top:12px">That is <b><span class="count" data-to="${Math.round(d.mins/60)}">0</span> hours</b>${days>=1?`, or ${days.toFixed(1)} full days`:''} of anime.</p>${note}`);
  S.push(`<small>Across</small><b class="big"><span class="count" data-to="${d.shows.length}">0</span></b><p>shows${d.completed.length?`, and you finished <b>${d.completed.length}</b>`:''}</p>
    ${d.completed.length?`<div class="wrgrid">${d.completed.slice().sort((a,b)=>(b.myScore||0)-(a.myScore||0)||(b.updated||0)-(a.updated||0)).slice(0,9).map(x=>`<img src="${esc(x.cover||'')}" alt="">`).join('')}</div>`:''}`);
  if(d.genres.length)S.push(`<small>Your top genre</small><h1 style="font-size:44px">${esc(d.genres[0][0])}</h1><p>${d.genres[0][1]} show${d.genres[0][1]>1?'s':''}</p>
    ${d.genres.length>1?`<ol class="wrlist">${d.genres.slice(1).map((g,i)=>`<li>${i+2}. ${esc(g[0])} <b>${g[1]}</b></li>`).join('')}</ol>`:''}`);
  if(d.top)S.push(`<small>Your most watched</small>${cov(d.top.x)}<h1 style="font-size:26px">${esc(titleOf(d.top.x))}</h1><p>${fmtTime(d.top.m)} of your time</p>`);
  if(d.rated&&d.rated.id!==d.top?.x.id)S.push(`<small>Your highest rated</small>${cov(d.rated)}<h1 style="font-size:26px">${esc(titleOf(d.rated))}</h1><p>♥ ${d.rated.myScore/10} / 10</p>`);
  else if(d.rated)S[S.length-1]+=`<p>and you rated it ♥ ${d.rated.myScore/10} / 10</p>`;
  if(d.activeDays)S.push(`<small>Your habits</small><ul class="wrlist">
    ${d.binge?`<li>Biggest binge: <b>${d.binge.n} episodes</b> on ${dateTxt(d.binge.at)}</li>`:''}
    <li>Longest streak: <b>${d.best} day${d.best>1?'s':''}</b></li><li>You watched on <b>${d.activeDays} day${d.activeDays>1?'s':''}</b></li>
    ${d.wday?`<li>Favourite day: <b>${d.wday}</b></li>`:''}</ul>`);
  if(d.reacts.length){const[e0,n0]=d.reacts[0],w=d.wow&&(list[d.wow[1]]||cache[d.wow[1]]);
    S.push(`<small>Your reactions</small><b class="big" style="font-size:96px">${e0}</b><p>was your go-to reaction, <b>${n0}</b> time${n0>1?'s':''}</p>
      ${d.reacts.length>1?`<p style="font-size:26px;letter-spacing:4px;margin-top:10px">${d.reacts.slice(1,6).map(([e,n])=>`${e}<small style="font-size:13px;letter-spacing:0">×${n}</small>`).join(' ')}</p>`:''}
      ${w?`<p style="margin-top:12px">Most mind-blowing: <b>${esc(titleOf(w))}</b>, episode ${d.wow[3]} 🤯</p>`:''}`)}
  S.push(`<small>Your anime personality</small><p style="font-size:18px">You are a…</p><h1 style="font-size:42px">${esc(d.persona[0])}</h1><p>${esc(d.persona[1])}</p>`);
  S.push(`<small>That was ${yr}</small><h1 style="font-size:28px">Share your Wrapped</h1><div id="wrShareBox" style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <button class="btn primary" id="wrMake">Make my image</button><span class="hint">Made on your device. Nothing is uploaded.</span></div>
    <button class="link" id="wrAgain" style="margin-top:12px">Watch again</button>`);
  return S;
}
function wrDraw(){
  const n=wr.slides.length;
  $('#modal').innerHTML=`<div class="wr" id="wr"><div class="wrbg"></div><div class="wrbars" aria-hidden="true">${wr.slides.map((_,i)=>`<i class="${i<=wr.i?'on':''}"></i>`).join('')}</div>
    <button class="close" id="mclose" aria-label="Close">✕</button>
    <div class="wrslide" id="wrSlide" aria-live="polite"><h2 class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Kuro Wrapped, part ${wr.i+1} of ${n}</h2>${wr.slides[wr.i]}</div>
    <div class="wrfoot"><button class="ibtn" id="wrPrev" aria-label="Previous" ${wr.i?'':'disabled'}>‹</button><span>${wr.i+1} / ${n}</span><button class="ibtn" id="wrNext" aria-label="Next" ${wr.i<n-1?'':'disabled'}>›</button></div></div>`;
  $('#mclose').onclick=closeModal;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('#wrSlide .count').forEach(el=>{const to=+el.dataset.to;if(still||to<2){el.textContent=fmtN(to);return}
    const t0=performance.now(),dur=1300;const f=t=>{if(!el.isConnected)return;const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmtN(to*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
const wrGo=d=>{if(!wr)return;const i=Math.max(0,Math.min(wr.slides.length-1,wr.i+d));if(i!==wr.i){wr.i=i;wrDraw()}};
$('#modal').addEventListener('click',e=>{
  if(!$('#wr'))return;
  const y=e.target.closest('[data-wy]');if(y){openWrapped(y.dataset.wy==='all'?'all':+y.dataset.wy);return}
  if(e.target.closest('#wrPrev'))return wrGo(-1);if(e.target.closest('#wrNext'))return wrGo(1);
  if(e.target.closest('#wrAgain')){wr.i=0;return wrDraw()}
  if(e.target.closest('#wrMake'))return wrShare();
  if(e.target.closest('button,a,img.wrprev,#mclose'))return;
  const r=$('#wr').getBoundingClientRect();wrGo(e.clientX-r.left<r.width*.35?-1:1);
});
addEventListener('keydown',e=>{if(!$('#wr'))return;if(e.key==='ArrowRight')wrGo(1);else if(e.key==='ArrowLeft')wrGo(-1)});
async function wrShare(){
  const box=$('#wrShareBox');box.innerHTML='<span class="hint">Making the image…</span>';
  let blob=null;try{blob=await wrappedImage(wr.d)}catch(err){console.warn('wrapped image',err)}
  if(!$('#wrShareBox'))return;
  if(!blob){box.innerHTML='<span class="hint">Sorry, the image could not be made.</span>';return}
  if(shareUrl)URL.revokeObjectURL(shareUrl);shareUrl=URL.createObjectURL(blob);
  const name=`kuro-wrapped-${wr.d.all?'all-time':wr.d.Y}.png`,file=new File([blob],name,{type:'image/png'});let can=false;try{can=!!navigator.canShare?.({files:[file]})}catch{}
  box.innerHTML=`<img class="wrprev" src="${shareUrl}" alt="Your Wrapped as an image"><div class="actions" style="justify-content:center">${can?'<button class="btn primary" id="wrShareBtn">Share…</button>':''}<a class="btn${can?'':' primary'}" href="${shareUrl}" download="${name}">Save image</a></div>`;
  if(can)$('#wrShareBtn').onclick=async()=>{try{await navigator.share({files:[file],title:'My anime Wrapped'})}catch{}};
}
async function wrappedImage(d){
  const cs=getComputedStyle(document.documentElement),v=k=>cs.getPropertyValue(k).trim();
  const C={bg:v('--bg'),bg2:v('--bg2'),card:v('--card'),card2:v('--card2'),line:v('--line'),text:v('--text'),muted:v('--muted'),a:v('--accent'),a2:v('--accent2')};
  const W=1080,H=1920,P=80,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  const font=(w,px)=>{x.font=`${w} ${px}px ${FONT}`};
  const text=(t,X,Y,col,align='left')=>{x.fillStyle=col;x.textAlign=align;x.fillText(t,X,Y)};
  const fit=(t,max)=>{t=String(t);if(x.measureText(t).width<=max)return t;while(t&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t.trimEnd()+'…'};
  const lines=(t,max,n)=>{const w=String(t).split(/\s+/),out=[];let l='';for(const s of w){const c=(l+' '+s).trim();if(x.measureText(c).width<=max)l=c;else{if(l)out.push(l);l=s}}if(l)out.push(l);
    if(out.length>n){out.length=n;out[n-1]=fit(out[n-1]+'…',max)}return out.map(s=>fit(s,max))};
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h)};
  const panel=(X,Y,w,h)=>{rr(X,Y,w,h,28);x.fillStyle=C.card;x.fill();x.lineWidth=2;x.strokeStyle=C.line;x.stroke()};
  const grad=(X,w)=>{const g=x.createLinearGradient(X,0,X+w,0);g.addColorStop(0,C.a);g.addColorStop(1,C.a2);return g};
  const spaced=on=>{if('letterSpacing' in x)x.letterSpacing=on?'3px':'0px'};
  const[logo,topImg]=await Promise.all([loadImg('icon-192.png'),d.top?coverImg(d.top.x.cover):null]);
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,C.bg2);bg.addColorStop(1,C.bg);x.fillStyle=bg;x.fillRect(0,0,W,H);
  for(const[cx,cy,r,col]of[[W*.95,120,820,C.a],[0,H*.72,760,C.a2]]){x.save();x.globalAlpha=.24;const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,col);g.addColorStop(1,/^#[0-9a-f]{6}$/i.test(col)?col+'00':'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.restore()}
  if(logo){x.save();rr(P,84,100,100,26);x.clip();x.drawImage(logo,P,84,100,100);x.restore()}
  font(800,48);text('Kuro Wrapped',P+124,130,C.text);font(500,30);text(fit(d.name,520),P+124,172,C.muted);
  font(900,120);x.fillStyle=grad(W-P-330,330);x.textAlign='right';x.fillText(d.all?'All time':String(d.Y),W-P,178);
  // episodes
  font(700,26);spaced(1);text('EPISODES WATCHED',P,330,C.muted);spaced(0);
  font(900,210);x.fillStyle=grad(P,700);x.textAlign='left';x.fillText(fmtN(d.eps),P-6,530);
  font(600,40);text(`${fmtN(d.mins/60)} hours${d.mins>=1440?` · ${(d.mins/1440).toFixed(1)} days`:''}`,P,600,C.text);
  // tiles
  const tw=(W-2*P-40)/3,ty=670;
  [['SHOWS',fmtN(d.shows.length)],['COMPLETED',fmtN(d.completed.length)],['TOP GENRE',d.genres[0]?.[0]||'–']].forEach(([l,val],i)=>{const X=P+i*(tw+20);panel(X,ty,tw,180);
    font(700,22);spaced(1);text(l,X+30,ty+52,C.muted);spaced(0);font(800,val.length>8?46:64);text(fit(val,tw-60),X+30,ty+135,C.text)});
  // personality
  font(700,26);spaced(1);text('MY ANIME PERSONALITY',P,950,C.muted);spaced(0);
  font(900,84);x.fillStyle=grad(P,W-2*P);x.textAlign='left';x.fillText(fit(d.persona[0],W-2*P),P,1045);
  font(500,34);lines(d.persona[1],W-2*P,2).forEach((l,i)=>text(l,P,1100+i*46,C.muted));
  // most watched
  if(d.top){const cy=1230,cw=270,ch=405;font(700,26);spaced(1);text('MOST WATCHED',P,cy-20,C.muted);spaced(0);
    x.save();rr(P,cy,cw,ch,22);x.clip();x.fillStyle=d.top.x.color||C.card2;x.fillRect(P,cy,cw,ch);
    if(topImg){const s=Math.max(cw/topImg.width,ch/topImg.height),iw=topImg.width*s,ih=topImg.height*s;x.drawImage(topImg,P+(cw-iw)/2,cy+(ch-ih)/2,iw,ih)}
    x.restore();x.lineWidth=2;x.strokeStyle=C.line;rr(P,cy,cw,ch,22);x.stroke();
    const tx=P+cw+40,tmax=W-P-tx;font(800,52);const tl=lines(titleOf(d.top.x),tmax,3);tl.forEach((l,i)=>text(l,tx,cy+70+i*62,C.text));
    font(500,34);text(`${fmtTime(d.top.m)} watched`,tx,cy+90+tl.length*62,C.muted);
    if(d.rated){font(600,32);text(fit(`♥ Highest rated: ${titleOf(d.rated)}`,tmax),tx,cy+ch-20,C.text)}}
  // habits

  if(hab){font(600,34);text(fit(hab,W-2*P),P,1730,C.text)}
  x.fillStyle=grad(P,W-2*P);x.fillRect(P,H-110,W-2*P,4);
  font(600,28);text('Kuro Watchlist',P,H-60,C.muted);text('Data from AniList',W-P,H-60,C.muted,'right');
  return await new Promise(res=>cv.toBlob(res,'image/png'));
}

async function wireOffline(){
  const show=async()=>{const c=await offCounts();if(c&&$('#offInfo'))$('#offInfo').textContent=`Your list, stats and diary always live on this device. Saved for offline: ${c.img} cover${c.img===1?'':'s'} and ${c.api} AniList page${c.api===1?'':'s'} (most recent kept).`};

    const b=e.target,urls=[...new Set(Object.values(list).map(x=>x.cover).filter(okUrl))];if(!urls.length)return toast('Your list is empty');
    if(!navigator.serviceWorker?.controller)return toast('Offline saving starts after Kuro reloads once');
    b.disabled=true;let done=0;const next=async()=>{while(urls.length){const u=urls.shift();try{await fetch(u,{mode:'cors',credentials:'omit'})}catch{}done++;if(b.isConnected)b.textContent=`Saving covers… ${done}`}};
    await Promise.all(Array.from({length:6},next));if(!b.isConnected)return;b.disabled=false;b.textContent='Save all my covers for offline';toast(`${done} covers saved for offline`);show();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  // An installed app on a phone can stay open for days, so look for a new version whenever it comes back to the
  // foreground (and every 30 min). When a new version takes over: reload right away if Kuro is in the background,
  // otherwise offer a Reload button so nothing you are doing is lost.
  const hadCtl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const chk=()=>{if(navigator.onLine)reg.update().catch(()=>{})};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,18e5);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtl||reloading)return;
    const go=()=>{reloading=true;location.reload()};
    if(document.hidden)return go();
    if(document.querySelector('.updbar'))return;
    const b=document.createElement('div');b.className='updbar';b.setAttribute('role','status');
    b.innerHTML='<span>✨ Kuro has been updated</span><button class="btn sm primary" type="button">Reload</button>';
    document.body.appendChild(b);b.querySelector('button').onclick=go;
    document.addEventListener('visibilitychange',()=>{if(document.hidden)go()},{once:true});
  });
}
